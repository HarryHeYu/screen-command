[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-command"
version = "0.2.0"
description = "Select anything on screen, turn it into usable data: capture -> OCR -> act."
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.6",
    "winrt-runtime>=3.2; sys_platform=='win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform=='win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform=='win32'",
    "winrt-Windows.Globalization>=3.2; sys_platform=='win32'",
    "winrt-Windows.Graphics.Imaging>=3.2; sys_platform=='win32'",
    "winrt-Windows.Media.Ocr>=3.2; sys_platform=='win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform=='win32'",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
